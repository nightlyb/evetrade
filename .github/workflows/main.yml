name: Main CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    name: Build and Test
    strategy:
      matrix:
        toolchain: [stable, beta, nightly]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}

      - name: Build the project
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Upload Test Results
        if: ${{ matrix.toolchain }} == 'stable'
        uses: actions/upload-artifact@v2
        with:
          name: evetrade-${{ matrix.os }}-${{ matrix.toolchain }}
          path: |
            target/release/evetrade
            target/release/evetrade.exe

  fixes:
    name: Run Clippy and Fix Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable && rustup default stable
      - run: rustup component add clippy
      - run: cargo clippy --fix --allow-dirty --allow-staged
      - run: cargo fmt
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "(CI) Apply clippy and rustfmt fixes."
          title: "(CI) Clippy and formatting fixes."
          body: "This PR applies fixes suggested by `cargo clippy --fix` and `cargo fmt`."
          branch: "ci/auto-fixes"
          delete-branch: true
          labels: "automated,clippy"
