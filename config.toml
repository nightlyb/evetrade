[settings]
log_level = "Debug"          # Trace, Debug, Error, Warn, Info
cache_dir = ".evecache"      # Directory to store universe and order data
update_universe_data = false # Should the universe data be updated

[user]
ship_cargo_volume = 6_300.0    # Your ship's cargo volume
initial_capital = 50_000_000.0 # Your initial capital
profit_goal = 50_000_000.0     # Profit goal for the route

[thresholds]
percentage_threshold = 10.0         # Percentage threshold for the price difference between two orders
pair_profit_threshold = 5_000_000.0 # Price threshold for the profit between two orders

[route]
max_jumps = 200           # Maximum number of jumps to consider for the route
security_threshold = -1.0 # Security threshold for the route

[advanced]
jump_window = 0.7          # Higher values mean less jumps are left for potential trade deviations along the way, and vice versa
similarity_threshold = 0.2 # Threshold for vector similarity between two orders
